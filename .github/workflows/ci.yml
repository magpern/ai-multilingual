name: CI

on:
  push:
    branches: [main]
  pull_request:

# WordPress core is pinned to the installed wp-phpunit version by
# tests/bin/install-wp.sh. WooCommerce is pinned explicitly below so an
# unpinned "latest" cannot resolve to a pre-release build whose changes would
# surface as unrelated CI failures. The minimum-supported-version matrix
# (PHP 8.1 / WP 6.5 / WC 8.2) is a later hardening milestone.
env:
  WC_VERSION: '10.9.4'

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer phpcs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: bash tests/bin/install-wp.sh
      - run: composer test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader
      - run: bash bin/build-zip.sh
      - run: bash bin/audit-zip.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ai-multilingual
          path: dist/ai-multilingual-*.zip

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer quality:validate
      - run: php tests/quality/bin/quality-validate.php C1.3
      - run: composer test:unit -- --filter Quality
      # Network-free official baseline replay (after TQ0.7 pack exists).
      - name: Verify official baseline-v1.1.0 evidence
        run: php tests/quality/bin/quality-verify-baseline.php
      - name: Verify additive H1.1 baseline scores
        run: |
          test -f tests/quality/baselines/baseline-v1.1.0/scores.H1.1.json
          php -r '
          require "vendor/autoload.php";
          use AIMultilingual\Quality\EvidencePack;
          use AIMultilingual\Quality\QualityScorerH11;
          $pack = new EvidencePack("tests/quality/baselines/baseline-v1.1.0");
          $frozen = $pack->load_scores("H1.1");
          $replay = (new QualityScorerH11())->score_pack($pack);
          $fs = $frozen["summary"] ?? [];
          $rs = $replay["summary"] ?? [];
          foreach (["total_cases","pass_count","critical_failures","not_applicable_count"] as $k) {
            if ((int)($fs[$k] ?? -1) !== (int)($rs[$k] ?? -2)) {
              fwrite(STDERR, "FAIL H1.1 summary mismatch on $k\n");
              exit(1);
            }
          }
          foreach ($frozen["case_results"] ?? [] as $id => $fr) {
            $rr = $replay["case_results"][$id] ?? null;
            if (null === $rr
              || (bool)$fr["pass"] !== (bool)$rr["pass"]
              || (int)$fr["critical_count"] !== (int)$rr["critical_count"]
              || (int)($fr["not_applicable_count"] ?? -1) !== (int)($rr["not_applicable_count"] ?? -2)
            ) {
              fwrite(STDERR, "FAIL H1.1 case mismatch: $id\n");
              exit(1);
            }
          }
          echo "PASS\tH1.1 baseline verify\tpass=" . (int)$rs["pass_count"] . "/" . (int)$rs["total_cases"]
            . " critical=" . (int)$rs["critical_failures"]
            . " not_applicable=" . (int)$rs["not_applicable_count"] . "\n";
          '
